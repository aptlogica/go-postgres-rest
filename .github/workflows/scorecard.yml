name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc #2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Filter and sanitize SARIF
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          # Remove results whose ruleId is CII-Best-Practices
          # Also remove results that contain invalid artifactLocation URIs (e.g. "no file associated with this alert")
          jq '
            (.runs[] .results) |= [
              .[]
              | select(.ruleId != "CII-Best-Practices")
              | select((.locations // []) | all(.physicalLocation?.artifactLocation?.uri?; . != "no file associated with this alert"))
            ]
          ' results.sarif > filtered.sarif || true
          mv filtered.sarif results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@0b7b740d4cd9b44f80c907b666497564df09d1d9
        with:
          sarif_file: results.sarif
