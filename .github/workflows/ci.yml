name: CI
permissions:
  contents: read
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'test-db-secure' }}
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'
      - run: go mod tidy
      - run: go vet ./...
      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 1
          done
        shell: bash
      - name: Run tests with coverage
        run: go test ./pkg/... -v -race -coverprofile=coverage.out -covermode=atomic -timeout 120s
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'test-db-secure' }}
          DB_NAME: testdb
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3.1.4 # eaaf4bedf32dbdc6b720b63067d99c4d77d6047d
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
      - name: Generate coverage report
        if: always()
        run: |
          go tool cover -html=coverage.out -o coverage.html
      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4.3.1 # 5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: coverage-report
          path: coverage.html
